<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さくら坂3丁目 自治会 周知</title>

  <style>
    body {
      font-family: "Yu Gothic", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
    }

    .pc-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: block;
    }

    .sp-img {
      display: none;
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .content {
      flex: 2 1 400px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }

    h1 {
      font-size: 1.2rem;
      color: #333;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .date {
      border: 2px dashed #aaa;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      display: inline-block;
    }

    .notice {
      border: 2px dashed #aaa;
      border-radius: 8px;
      padding: 10px;
      background: #ffec80;
      min-height: 4.5em;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 1rem;
    }

    .footer {
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .pc-img { display: none; }
      .sp-img { display: block; }

      h1 {
        font-size: 1rem;
        margin-bottom: 10px;
      }

      .notice {
        font-size: 1rem;
        min-height: 5em;
      }

      body {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="sakura.jpg" class="pc-img" alt="桜の写真（PC用）">
    <img src="smaPhSakura.jpg" class="sp-img" alt="桜の写真（スマホ用）">

    <div class="content">
      <h1>♪ さくら坂3丁目 自治会 周知 ♪</h1>

      <!-- ▼ GASから取得した日付が入る -->
      <div class="date" id="notice-date">読み込み中...</div>

      <!-- ▼ GASから取得した本文が入る -->
      <div class="notice" id="notice-text">
        読み込み中...
      </div>

      <div class="footer">© さくら坂3丁目 自治会</div>
    </div>

  </div>

<script>
  // ▼ GAS Web API の URL（周知内容）
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzkU1ICIf8jnUE5LfZmWUAhIzmVn-PoKnzx4geXqB6TTSAwAMcpFc4u_fl44kRo9Mfl/exec?mode=getNotice";

  // ▼ PVログAPI（あなたのURL）
  const PV_URL =
    "https://script.google.com/macros/s/AKfycbzkiXdVaqLdrCBLO5TzZgUzfNalrLLeQVLM2x-wkxEhYb7AhPfwurUm8uO0vvI64xZq2Q/exec";

  /* ▼ ISO文字列 → JST yyyy/mm/dd hh:mm に変換 */
  function formatJST(isoString) {
    const d = new Date(isoString);
    const yyyy = d.getFullYear();
    const mm = ("0" + (d.getMonth() + 1)).slice(-2);
    const dd = ("0" + d.getDate()).slice(-2);
    const hh = ("0" + d.getHours()).slice(-2);
    const mi = ("0" + d.getMinutes()).slice(-2);
    return `${yyyy}/${mm}/${dd} ${hh}:${mi}`;
  }

  // ▼ 周知内容を取得して反映
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      const formatted = formatJST(data.date);

      document.getElementById("notice-date").innerText =
        "周知日付：" + formatted;

      document.getElementById("notice-text").innerText = data.text;

      // ▼ PVログ送信（ここが重要）
      fetch(PV_URL + "?ua=" + encodeURIComponent(navigator.userAgent));
    })
    .catch(err => {
      document.getElementById("notice-date").innerText = "取得エラー";
      document.getElementById("notice-text").innerText =
        "データを取得できませんでした。";
    });
</script>


</body>
</html>
